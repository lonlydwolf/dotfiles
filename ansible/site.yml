---
- name: Converge this machine to its declared state
  hosts: all
  gather_facts: true
  # mise reads the chezmoi source config: ~/.config/mise/config.toml does not
  # exist before the dotfiles role on a cold machine
  environment:
    MISE_GLOBAL_CONFIG_FILE: "{{ playbook_dir }}/../home/dot_config/mise/config.toml"
  roles:
    - role: packages
      tags: [packages]
    - role: macos_defaults
      when: ansible_facts['os_family'] == "Darwin"
      tags: [macos_defaults]
    - role: build                 # self-built binaries (starship-jj) → ~/.local/bin
      tags: [build]
    - role: prune                 # Gate 1: `never` keeps it out of default runs
      tags: [prune, never]
    - role: dotfiles              # MUST be last (applies chezmoi)
      tags: [dotfiles]
