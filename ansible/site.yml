---
- name: Converge this machine to its declared state
  hosts: all
  gather_facts: true
  roles:
    - role: packages
      tags: [packages]
    - role: macos_defaults
      when: ansible_system == "Darwin"
      tags: [macos_defaults]
    - role: prune                 # Gate 1: `never` keeps it out of default runs
      tags: [prune, never]
    - role: dotfiles              # MUST be last (applies chezmoi)
      tags: [dotfiles]
