---
# Read-only audit (opt-in via the `never` tag). Real removal is interactive: `just prune -f`.
- name: Prune audit (brew) — mac-only; report only
  when: ansible_facts['os_family'] == "Darwin"
  block:
    - name: Audit — what is NOT in the Brewfile (read-only)
      ansible.builtin.command: "brew bundle cleanup --file={{ brewfile }}"
      register: prune_audit
      changed_when: false
      failed_when: false
      check_mode: false
    - name: Show what a prune WOULD remove
      ansible.builtin.debug:
        msg: "{{ prune_audit.stdout_lines | default(['(nothing to prune)'], true) }}"
    - name: Audit — outdated download caches (read-only)
      ansible.builtin.command: brew cleanup --prune=all --dry-run
      register: cleanup_audit
      changed_when: false
      failed_when: false
      check_mode: false
    - name: Show what a cache purge WOULD remove
      ansible.builtin.debug:
        msg: "{{ cleanup_audit.stdout_lines | default(['(no caches to purge)'], true) }}"
    - name: Report — how to remove
      ansible.builtin.debug:
        msg: "Run `just prune -f` to uninstall the above and purge caches (interactive)."
      when: (prune_audit.stdout | length > 0) or (cleanup_audit.stdout | length > 0)
