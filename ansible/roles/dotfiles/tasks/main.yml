---
# --source points chezmoi at the existing clone; NEVER `chezmoi init <user>` — that re-clones.
- name: Generate chezmoi config (sets sourceDir + age; idempotent)
  ansible.builtin.command: "chezmoi init --source {{ ansible_facts['env']['HOME'] }}/dotfiles"
  changed_when: false

- name: Audit — dotfiles drift (chezmoi diff)
  ansible.builtin.command: chezmoi diff
  register: chezmoi_diff
  changed_when: false
  failed_when: false
  check_mode: false

- name: Show dotfiles drift
  ansible.builtin.debug:
    msg: "{{ chezmoi_diff.stdout_lines }}"

- name: Converge — apply dotfiles
  ansible.builtin.command: chezmoi apply
  when: chezmoi_diff.stdout | length > 0
  changed_when: true
