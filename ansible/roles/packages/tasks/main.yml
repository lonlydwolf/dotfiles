---
- name: macOS packages (brew bundle) — audit only; converge with `just install`
  when: ansible_facts['os_family'] == "Darwin"
  block:
    - name: Audit — Brewfile satisfied? (rc != 0 = drift)
      ansible.builtin.command: "brew bundle check --file={{ brewfile }} --verbose --no-upgrade"
      register: brew_audit
      changed_when: false
      failed_when: false
      check_mode: false
    - name: Show brew audit
      ansible.builtin.debug:
        msg:
          rc: "{{ brew_audit.rc }}"
          stdout: "{{ brew_audit.stdout_lines | default([], true) }}"
          stderr: "{{ brew_audit.stderr_lines | default([], true) }}"
    - name: Report — Brewfile requires attention
      ansible.builtin.debug:
        msg: >-
          Brewfile check returned rc={{ brew_audit.rc }}.
          Review the audit output above. If dependencies are missing,
          run `just install` to converge.
      when: brew_audit.rc != 0

- name: Arch packages (pacman) — stub
  when: ansible_facts['os_family'] == "Archlinux"
  block:
    - name: pacman placeholder
      ansible.builtin.debug:
        msg: "pacman role — TODO when porting to Arch"

# mise (cross-OS): global toolchain
- name: Audit — missing mise tools ({} = none)
  ansible.builtin.command: "mise ls --missing --json"
  register: mise_audit
  changed_when: false
  failed_when: false
  check_mode: false
- name: Show missing mise tools
  ansible.builtin.debug:
    msg: "{{ (mise_audit.stdout | default('{}') | from_json) or '(mise tools in sync)' }}"
- name: Converge — install declared mise tools
  ansible.builtin.command: "mise install"
  when: (mise_audit.stdout | default('{}') | from_json | length) > 0
  changed_when: true
