[[mgr.prepend_keymap]]
on = "<C-p>"
run = "shell --orphan -- quicklook %s"

# Plugin: chmod
[[mgr.prepend_keymap]]
on = ["c", "m"]
run = "plugin chmod"
desc = "Chmod on selected files"

# Plugin: ouch (Compression)
[[mgr.prepend_keymap]]
on = ["C"]
run = "plugin ouch"
desc = "Compress with ouch"

# Git: cd to root
[[mgr.prepend_keymap]]
on = ["g", "r"]
run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"'
desc = "Go to git root"

# Smart Enter
[[mgr.prepend_keymap]]
on = ["l"]
run = "plugin smart-enter"
desc = "Enter directory or open file"

[[mgr.prepend_keymap]]
on = ["<Enter>"]
run = "plugin smart-enter"
desc = "Enter directory or open file"

# Plugin: Copy-file-contents
[[mgr.prepend_keymap]]
on = ["c", "y"]
run = "plugin copy-file-contents -- plain"
desc = "Copy contents of file(s)"

[[mgr.prepend_keymap]]
on = ["c", "Y"]
run = "plugin copy-file-contents -- multi"
desc = "Copy contents of file(s) with filename + code fence"
