## ~/.config/tmux/tmux.conf
# ─────────────────────────────────────────────────────────────
# TPM setup
# ─────────────────────────────────────────────────────────────
set-environment -gF TMUX_PLUGIN_MANAGER_PATH '#{HOME}/.local/share/tmux/plugins/'

if 'test ! -d "${TMUX_PLUGIN_MANAGER_PATH}/tpm"' {
  run 'mkdir -p "${TMUX_PLUGIN_MANAGER_PATH}"'
  run 'git clone https://github.com/tmux-plugins/tpm "${TMUX_PLUGIN_MANAGER_PATH}/tpm"'
  run '${TMUX_PLUGIN_MANAGER_PATH}/tpm/bin/install_plugins'
}

# ─────────────────────────────────────────────────────────────
# Core behavior
# ─────────────────────────────────────────────────────────────

# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Windows/panes start at 1, not 0 — easier to reach on keyboard,
# and closing a window renumbers the rest so there are no gaps.
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Fixes the Neovim Esc-key delay caused by tmux's default 500ms
# escape-time (tmux waits to see if Esc is the start of an
# escape sequence, e.g. an arrow key).
set -sg escape-time 10

# --- Terminal Title Management ---
set -g set-titles on
set -g set-titles-string "#S"


# Mouse: drag-resize panes + scroll-to-copy-mode. Purely additive,
# doesn't interfere with keyboard-driven navigation.
set -g mouse on

# True color support — required for Catppuccin to render correctly.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Reload config without restarting tmux.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# ─────────────────────────────────────────────────────────────
# Pane splitting — mnemonic keys, inherit current pane's cwd
# ─────────────────────────────────────────────────────────────

unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ─────────────────────────────────────────────────────────────
# Pane navigation — handled by vim-tmux-navigator (plugin below).
# These bindings let C-h/j/k/l move between tmux panes AND
# Neovim splits seamlessly, using the same keys either way.
# ─────────────────────────────────────────────────────────────

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"

bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

# ─────────────────────────────────────────────────────────────
# Copy mode — vi keys + system clipboard via tmux-yank
# ─────────────────────────────────────────────────────────────

setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# ─────────────────────────────────────────────────────────────
# Session management — sesh, wired through an fzf-tmux popup.
# Bound to prefix + K .
# ─────────────────────────────────────────────────────────────

# bind-key K run-shell "sesh connect \"$( \
#     sesh list --icons | fzf-tmux -p 55%,60% \
#         --no-sort --ansi --border-label ' sesh ' --prompt '⚡ ' \
#         --header '  ^a all  ^t tmux  ^g configs  ^x zoxide  ^d kill  ^f find' \
#         --bind 'tab:down,btab:up' \
#         --bind 'ctrl-a:change-prompt(⚡ )+reload(sesh list --icons)' \
#         --bind 'ctrl-t:change-prompt(🪟 )+reload(sesh list -t --icons)' \
#         --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
#         --bind 'ctrl-x:change-prompt(📁 )+reload(sesh list -z --icons)' \
#         --bind 'ctrl-f:change-prompt(🔎 )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
#         --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡ )+reload(sesh list --icons)' \
# )\""
bind-key K run-shell "~/.config/sesh/scripts/tmux-sesh-picker"

# Quality-of-life settings sesh's docs recommend alongside it:
bind-key x kill-pane          # skip the "kill-pane 1? (y/n)" prompt
bind-key & kill-window        # skil the "kill-window 1> (y/n)" prompt
set -g detach-on-destroy off  # don't exit tmux entirely when a session closes

# ─────────────────────────────────────────────────────────────
# Plugins (via TPM — Tmux Plugin Manager)
# ─────────────────────────────────────────────────────────────

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# --- tmux-resurrect / tmux-continuum: auto session persistence ---
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'        # autosave every 15 min

# --- tmux-floax: floating scratch pane ---
set -g @floax-bind 'p'                      # prefix + p toggles the float
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color '#cba6f7'        # catppuccin mauve
set -g @floax-text-color '#cdd6f4'          # catppuccin text

# --- tmux-thumbs: hint-based text picking ---
set -g @thumbs-command 'echo -n {} | pbcopy'
set -g @thumbs-multi-command 'echo -n {} | pbcopy'

# ─────────────────────────────────────────────────────────────
# Catppuccin & Looks 
# ─────────────────────────────────────────────────────────────

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"

run '#{TMUX_PLUGIN_MANAGER_PATH}/tmux/catppuccin.tmux'
source -F '#{d:current_file}/custom_modules/cgm.conf'

# status left look and feel
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #S },#{#[bg=#{@thm_bg},fg=#{@thm_green}]  #S }}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_maroon}]  #{pane_current_command} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"

# status right look and feel
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_blue}] 󰭦 %Y-%m-%d 󰅐 %H:%M "
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]│"
set -ga status-right "#[bg=#{@thm_bg},fg=#(~/.config/tmux/scripts/glucose-color.sh)] 󰍛 #(~/.config/tmux/scripts/glucose-status.sh) "


set -g status-position top
set -g status-style "bg=#{@thm_bg}"
set -g status-justify "absolute-centre"

# pane border look and feel
setw -g pane-border-status top
setw -g pane-border-format \
" #[fg=#{@thm_mauve},bold]󰕰 #{pane_index} #[fg=#{@thm_text}]#{pane_current_command} "
setw -g pane-active-border-style \
"fg=#{@thm_blue}"
setw -g pane-border-style \
"fg=#{@thm_surface_1}"
setw -g pane-border-lines heavy
# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "Window"

set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=#{@thm_bg},fg=#{@thm_rosewater}"
set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_peach}"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"

set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=#{@thm_peach},fg=#{@thm_bg},bold"


run '#{TMUX_PLUGIN_MANAGER_PATH}/tpm/tpm'
