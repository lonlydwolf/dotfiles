# ==============================================================================
# Starship
# ==============================================================================
# In zsh, Starship supplies the pieces of the prompt and ~/.config/zsh/prompt.zsh
# lays them out. That file asks for one of the two profiles below once per
# prompt and splits the answer on U+001F:
#
#   repository state · path · language · OS · user · host
#
# Identity is reported unstyled because prompt.zsh decides how loud it is.
# `format` is what any other shell gets from `starship init`.

"$schema" = "https://starship.rs/config-schema.json"
command_timeout = 500
palette = "mocha"
continuation_prompt = "[▶▶ ](fg:surface2)"

format = "($vcs  )$directory$line_break$character"
right_format = ""

[profiles]
block = "$vcs\u001f$directory\u001f\u001f$os\u001f$username\u001f$hostname"
block_lang = "$vcs\u001f$directory\u001f$golang$python$rust$nodejs$c$cpp\u001f$os\u001f$username\u001f$hostname"

# ==============================================================================
# Color Palette (Catppuccin Mocha)
# ==============================================================================
# prompt.zsh carries the same values for the parts it draws itself.
[palettes.mocha]
text = "#cdd6f4"
overlay1 = "#7f849c"
surface2 = "#585b70"
mauve = "#cba6f7"
green = "#a6e3a1"
peach = "#fab387"
red = "#f38ba8"
yellow = "#f9e2af"
blue = "#89b4fa"
teal = "#94e2d5"
sapphire = "#74c7ec"

# ==============================================================================
# Repository State
# ==============================================================================
# jj wins wherever a repository is both. Every item brings its own leading
# space, so nothing is left behind when an item is absent.

[vcs]
order = ["jj", "git"]
jj_modules = "$jj_change$jj_status$jj_metrics"
git_modules = "$git_branch$git_commit$git_state$git_status"

[jj_change]
format = "$change"
change_hash_length = 4
prefix_style = "bold fg:mauve"
suffix_style = "fg:overlay1"

# prompt.zsh reads "conflict", "immutable" and the file counts from this text
# to pick the node drawn in front of the change id.
[jj_status]
format = "($modified$added$deleted$renamed$copied)($conflicted)($immutable)($description)"
modified = "[ M$count](fg:peach)"
added = "[ A$count](fg:green)"
deleted = "[ D$count](fg:red)"
renamed = "[ R$count](fg:blue)"
copied = "[ C$count](fg:blue)"
conflicted = "[ conflict](fg:red)"
immutable = "[ immutable](fg:sapphire)"
description_empty = "[ ◌](fg:yellow)"
description_present = ""

[jj_metrics]
format = "([ +$added]($added_style))([ −$deleted]($deleted_style))"
added_style = "fg:green"
deleted_style = "fg:red"

[git_branch]
format = "[*](fg:peach) [$branch](fg:mauve)"
truncation_length = 24
truncation_symbol = "…"

[git_commit]
format = "[ $hash$tag](fg:overlay1)"

[git_state]
format = "[ $state( $progress_current/$progress_total)](fg:red)"

[git_status]
format = "($ahead_behind$conflicted$modified$staged$deleted$renamed$untracked)"
ahead = "[ ↑$count](fg:teal)"
behind = "[ ↓$count](fg:teal)"
diverged = "[ ↑$ahead_count↓$behind_count](fg:peach)"
conflicted = "[ conflict](fg:red)"
modified = "[ M$count](fg:peach)"
staged = "[ A$count](fg:green)"
deleted = "[ D$count](fg:red)"
renamed = "[ R$count](fg:blue)"
untracked = "[ ?$count](fg:overlay1)"
stashed = ""

# ==============================================================================
# Path
# ==============================================================================

[directory]
format = "[$path]($style)[$read_only]($read_only_style)"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)"
style = "fg:text"
repo_root_style = "bold fg:text"
truncation_length = 4
truncation_symbol = "…/"
read_only = " ro"
read_only_style = "fg:red"

# ==============================================================================
# Language
# ==============================================================================
# Starship shows each of these only where the current directory holds that
# language. They are asked for through `block_lang` alone, so their version
# commands do not run on every prompt.

[golang]
format = "[go $version ](fg:overlay1)"
version_format = "${major}.${minor}"

[python]
format = "[py $version( $virtualenv) ](fg:overlay1)"
version_format = "${major}.${minor}"

[rust]
format = "[rust $version ](fg:overlay1)"
version_format = "${major}.${minor}"

[nodejs]
format = "[node $version ](fg:overlay1)"
version_format = "${major}"

[c]
format = "[$name $version ](fg:overlay1)"
version_format = "${major}"

[cpp]
disabled = false
format = "[$name $version ](fg:overlay1)"
version_format = "${major}"

# ==============================================================================
# Identity
# ==============================================================================

[os]
disabled = false
format = "$symbol"

[os.symbols]
Macos = ""
Arch = "\U000F08C7"   # 5-digit hex codes require uppercase \\U padding
Ubuntu = "\U000F0548" # 5-digit hex codes require uppercase \\U padding
Fedora = ""

[username]
show_always = true
format = "$user"

[hostname]
ssh_only = false
format = "$hostname"

# ==============================================================================
# Caret
# ==============================================================================
# Only for shells without prompt.zsh, which draws its own.

[character]
success_symbol = "[❯](fg:green)"
error_symbol = "[❯](fg:red)"
vimcmd_symbol = "[❮](fg:blue)"
